name: Validate Schemas (3-domain)
on:
  push:
    paths: ["sim3-contracts/**"]
  pull_request:
    paths: ["sim3-contracts/**"]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r sim3-contracts/requirements.txt
      - name: Validate samples
        run: |
          python sim3-contracts/tools/validate.py
