services:
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: mosquitto
    ports:
      - "8883:8883"
    volumes:
      - ./conf:/mosquitto/config
      - ./conf/certs:/mosquitto/config/certs:ro
      - ./data:/mosquitto/data
      - ./log:/mosquitto/log
    command: >
      sh -c "chmod 0700 /mosquitto/config/aclfile &&
             mosquitto -c /mosquitto/config/mosquitto.conf"
    restart: unless-stopped
