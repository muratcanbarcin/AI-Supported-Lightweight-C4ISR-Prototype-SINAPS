# SINAPS backend configuration.
# Secrets are read from the environment. Copy the repository .env.example
# to .env and export it before starting the process. Do not commit real values.

spring.application.name=backend

# PostgreSQL with PostGIS
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/c4isr_db}
spring.datasource.username=${DB_USERNAME:admin}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=10

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true

server.port=${SERVER_PORT:8080}
server.error.include-message=never
server.error.include-stacktrace=never

mqtt.broker.url=${MQTT_BROKER_URL:tcp://localhost:1883}
mqtt.broker.client-id=${MQTT_CLIENT_ID:c4isr-backend}

ai.service.url=${AI_SERVICE_URL:http://127.0.0.1:8000}

simulation.tick-interval-ms=${SIMULATION_TICK_INTERVAL_MS:15000}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when_authorized
management.endpoints.web.base-path=/api/v1/actuator

# At least 32 characters. HS256 rejects shorter keys.
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Applied only when the user table is empty. Never log this value.
sinaps.seed.default-password=${SEED_DEFAULT_PASSWORD:}

sinaps.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000,http://localhost:5173,http://127.0.0.1:5173}
