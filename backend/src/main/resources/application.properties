# ============================================
# C4ISR Backend - Application Configuration
# ============================================
spring.application.name=backend

# ============================================
# PostgreSQL with PostGIS Configuration
# ============================================
spring.datasource.url=jdbc:postgresql://localhost:5433/c4isr_db
spring.datasource.username=admin
spring.datasource.password=password
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP Connection Pool Settings
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=10

# ============================================
# Hibernate / JPA Configuration
# ============================================
# PostgreSQL Dialect (Hibernate 7+ auto-detects PostGIS when hibernate-spatial is present)
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update

# SQL Logging (for debugging)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# ============================================
# MQTT Broker Configuration
# ============================================
mqtt.broker.url=tcp://localhost:1883
mqtt.broker.client-id=c4isr-backend

# ============================================
# Server Configuration
# ============================================
server.port=8080

# ============================================
# AI Service Configuration
# ============================================
# 127.0.0.1: Windows'ta localhost→::1 ile Python (127.0.0.1) uyuşmazlığında sağlık kontrolü başarısız olmasın
ai.service.url=http://127.0.0.1:8000

# ============================================
# Simulation Engine
# ============================================
# Tick interval (ms) for SimulationEngine. Default 120000 (2 min) to throttle
# synthetic telemetry volume. Lower (e.g. 3000) for fast local debugging.
simulation.tick-interval-ms=15000

# ============================================
# Actuator Configuration
# ============================================
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.endpoints.web.base-path=/api/v1/actuator

# ============================================
# JWT Configuration
# ============================================
jwt.secret=sinaps-super-secret-jwt-key-change-this-in-production-2026
jwt.expiration-ms=86400000
