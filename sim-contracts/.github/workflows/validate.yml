name: Validate Schemas
on:
  push:
    paths: ["sim-contracts/**"]
  pull_request:
    paths: ["sim-contracts/**"]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r sim-contracts/requirements.txt
      - name: Validate samples against schemas
        run: |
          python sim-contracts/tools/validate.py
