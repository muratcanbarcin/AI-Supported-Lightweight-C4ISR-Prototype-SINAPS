spring.application.name=c4isr-backend
# --- Veritaban? Ba?lant?s? ---
spring.datasource.url=jdbc:postgresql://localhost:5432/sinaps_db
spring.datasource.username=postgres
spring.datasource.password=sifreniz 
spring.datasource.driver-class-name=org.postgresql.Driver

# --- Hibernate & JPA Ayarlar? ---
spring.jpa.hibernate.ddl-auto=update

# SQL sorgular?n? konsolda göster (Geli?tirme a?amas?nda çok faydal?)
spring.jpa.show-sql=true

# PostGIS Dialect (Veritaban?n?n co?rafi veriyi anlamas? için ?ART)
spring.jpa.properties.hibernate.dialect=org.hibernate.spatial.dialect.postgis.PostgisDialect

# --- PostGIS Geometri Dönü?ümü (Otomatik) ---
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
# --- MQTT Ayarlar? (SIN-12) ---
