services:
  postgres:
    build: ./postgres
    container_name: c4isr-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
      POSTGRES_DB: c4isr_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init-vector.sql:/docker-entrypoint-initdb.d/02-init-vector.sql
    networks:
      - c4isr-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d c4isr_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # AI Service runs LOCALLY, not in Docker (faster startup, GPU support)
  # To run: cd ai-service && python main.py

  mosquitto:
    image: eclipse-mosquitto:latest
    container_name: c4isr-mqtt
    restart: unless-stopped
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./mosquitto/config/mosquitto.conf:/mosquitto/config/mosquitto.conf
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log
    networks:
      - c4isr-network

  # -------------------------------------------------------------------
  # Edge AI Middleware (IsolationForest anomaly detection + MQTT router)
  # -------------------------------------------------------------------
  middleware:
    build: ./middleware
    container_name: c4isr-middleware
    restart: unless-stopped
    environment:
      MQTT_BROKER_HOST: c4isr-mqtt
      MQTT_BROKER_PORT: 1883
      MQTT_TOPIC: c4isr/telemetry
      BACKEND_URL: http://host.docker.internal:8080/api/v1/telemetry
      AI_SERVICE_URL: http://host.docker.internal:8000/analyze
      LOG_LEVEL: INFO
    depends_on:
      - mosquitto
    networks:
      - c4isr-network

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: c4isr-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - c4isr-network
    depends_on:
      postgres:
        condition: service_healthy

networks:
  c4isr-network:
    driver: bridge
    name: c4isr-network

volumes:
  postgres_data:
    name: c4isr-postgres-data
  mosquitto_data:
    name: c4isr-mosquitto-data
  mosquitto_log:
    name: c4isr-mosquitto-log
  pgadmin_data:
    name: c4isr-pgadmin-data